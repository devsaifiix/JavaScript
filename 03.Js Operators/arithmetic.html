<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic Operators</title>
</head>

<body>

    <h1>Arithmetic Operators</h1>

    <p id="demo"></p>

    <script>

        let x = 5;
        let y = 2;

        document.getElementById("demo").innerHTML += "Addition = " + (x + y) + "<br>";

        document.getElementById("demo").innerHTML += "Subtraction = " + (x - y) + "<br>";

        document.getElementById("demo").innerHTML += "Multiplication = " + (x * y) + "<br>";

        document.getElementById("demo").innerHTML += "Division = " + (x / y) + "<br>";

        document.getElementById("demo").innerHTML += "Modulus = " + (x % y) + "<br>";

        x++;

        document.getElementById("demo").innerHTML += "Increment in x = " + x + "<br>";

        y--;

        document.getElementById("demo").innerHTML += "decrement in y = " + y + "<br>";

        document.getElementById("demo").innerHTML += x + " raised to the power of " + y + " = " + (x ** y) + "<br>"; // or
        document.getElementById("demo").innerHTML += x + " raised to the power of " + y + " = " + Math.pow(x, y) + "<br>";
    </script>

</body>

</html>
